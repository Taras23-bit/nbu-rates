<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Курси валют НБУ з аналітикою Gemini</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">API НБУ · Gemini API</p>
    <h1>Курси валют НБУ</h1>
    <p class="lead">Офіційні курси, динаміка за період, конвертер і пояснення від Gemini.</p>
  </header>

  <main>
    <p id="status" class="status" hidden></p>

    <section class="card">
      <div class="card-head">
        <h2>Курси на сьогодні</h2>
        <span id="rates-date" class="muted"></span>
      </div>
      <input id="search" placeholder="Пошук валюти: USD, євро, злотий…">
      <div class="rates-wrap">
      <table class="rates">
        <thead><tr><th>Код</th><th>Валюта</th><th class="num">Курс, грн</th></tr></thead>
        <tbody id="rates"></tbody>
      </table>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Динаміка курсу</h2>
        <div class="controls">
          <select id="currency"></select>
          <div class="periods" id="periods">
            <button type="button" data-days="7">7 дн</button>
            <button type="button" data-days="30" class="active">30 дн</button>
            <button type="button" data-days="90">90 дн</button>
            <button type="button" data-days="365">1 рік</button>
          </div>
        </div>
      </div>
      <div class="tiles" id="tiles"></div>
      <div id="chart" class="chart"></div>
    </section>

    <div class="grid2">
      <section class="card">
        <h2>Конвертер</h2>
        <form id="convert" class="convert">
          <input id="amount" type="number" min="0.01" step="0.01" value="100" required>
          <select id="from"></select>
          <span class="arrow">→</span>
          <select id="to"></select>
          <button type="submit">Порахувати</button>
        </form>
        <p id="convert-result" class="big"></p>
        <p id="convert-rate" class="muted small"></p>
      </section>

      <section class="card">
        <h2>Аналітика Gemini</h2>
        <p class="muted small">Gemini пояснює динаміку вибраної валюти за вибраний період. Усі числа рахує сервер.</p>
        <button id="analyze" type="button">Пояснити динаміку</button>
        <div id="analysis" hidden>
          <p><span id="trend" class="badge"></span></p>
          <p id="summary"></p>
          <ul id="points"></ul>
          <p id="explanation"></p>
          <p id="disclaimer" class="muted small"></p>
        </div>
      </section>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
